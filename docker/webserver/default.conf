server {
    listen 8080;
    server_name _;

    root /www_data;
    index karte.html;

    # Variable proxy_pass forces nginx to use the Docker resolver at request
    # time, so an auth container restart does not leave a stale IP behind.
    set $auth_backend "auth:8080";

    client_max_body_size 8k;

    # Keep redirects relative. Otherwise nginx uses its internal port 8080 in
    # Location headers, and Traefik would send the browser to :8080.
    absolute_redirect off;

    include /etc/nginx/security-headers.conf;

    # Traefik allows encoded slashes/question marks globally for other services.
    # The map does not need them, so reject them in the request path only.
    # Query strings remain untouched, e.g. ?other=%23tag.
    if ($request_uri ~* "^[^?]*%(2f|3f)") {
        return 400;
    }

    error_page 429 = @rate_limited;

    # Raw member data must never be served, even if it ends up in the web root.
    location ~ /members\.json$ {
        return 404;
    }

    location = /shared/members.json {
        return 404;
    }

    # Internal session check used by auth_request. Never publicly reachable.
    location = /_internal/session-check {
        internal;

        proxy_pass http://$auth_backend/session-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Public login and logout.
    # With a variable in proxy_pass, nginx does not automatically append the
    # original query string. Preserve it explicitly for next/local/error.
    location = /login {
        limit_req zone=login burst=5 nodelay;

        proxy_pass http://$auth_backend/login$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # OAuth2 login start and callback. Both routes are public and must not be
    # protected by auth_request. The callback query contains code and state,
    # so it must be forwarded explicitly.
    location = /auth/forum/login {
        proxy_pass http://$auth_backend/auth/forum/login$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /auth/forum/callback {
        proxy_pass http://$auth_backend/auth/forum/callback$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Pre-blurred login background, embedded in the auth service.
    location = /login-background.jpg {
        proxy_pass http://$auth_backend/login-background.jpg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        include /etc/nginx/security-headers.conf;
    }

    location = /logout {
        proxy_pass http://$auth_backend/logout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Public legal pages and a small status endpoint for the map footer.
    location = /impressum {
        proxy_pass http://$auth_backend/impressum;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /datenschutz {
        proxy_pass http://$auth_backend/datenschutz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /legal-status {
        proxy_pass http://$auth_backend/legal-status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Protected map entry point.
    location = / {
        auth_request /_internal/session-check;
        error_page 401 = @login_redirect;

        try_files /karte.html =404;

        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /karte.html {
        auth_request /_internal/session-check;
        error_page 401 = @login_redirect;

        try_files $uri =404;

        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Protected member data.
    location ^~ /shared/ {
        auth_request /_internal/session-check;
        error_page 401 = @unauthorized;

        try_files $uri =404;

        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Public PWA files.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /service-worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /app-version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    location ^~ /css/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /js/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /offline.html {
        expires 1h;
    }

    location = /geo-handler {
        try_files /geo-handler.html =404;
    }

    location = /geo-handler.html {
        expires 1h;
    }

    location = /favicon.ico {
        try_files /icons/icon-192.png =404;
    }

    location ^~ /icons/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /screenshots/ {
        try_files $uri =404;
        expires 7d;
    }

    location ^~ /leaflet/ {
        try_files $uri =404;
        expires 7d;
    }

    location ^~ /markercluster/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        return 404;
    }

    location @login_redirect {
        return 302 /login?next=$uri;
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"unauthorized"}';
    }

    location @rate_limited {
        default_type text/html;
        return 429 '<!doctype html><html lang="de"><meta charset="utf-8"><title>Zu viele Versuche</title><p>Zu viele Anmeldeversuche. Bitte spÃ¤ter erneut versuchen.</p></html>';
    }
}
